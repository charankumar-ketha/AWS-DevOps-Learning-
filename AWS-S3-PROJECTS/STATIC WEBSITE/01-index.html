<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS S3 Static Website</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #232f3e, #ff9900);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
            background: rgba(255, 255, 255, 0.12);
            padding: 50px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 45px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .badge {
            display: inline-block;
            padding: 12px 20px;
            background: white;
            color: #232f3e;
            border-radius: 30px;
            font-weight: bold;
        }

        .skills {
            margin-top: 30px;
        }

        .skills span {
            display: inline-block;
            margin: 6px;
            padding: 8px 15px;
            border: 1px solid white;
            border-radius: 20px;
        }

        footer {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚀 AWS S3 Static Website</h1>

        <p>
            Welcome to my AWS hands-on project!
            This website is hosted using Amazon S3 Static Website Hosting.
        </p>

        <div class="badge">
            Successfully Deployed on AWS ☁️
        </div>

        <div class="skills">
            <span>Amazon S3</span>
            <span>HTML</span>
            <span>AWS</span>
            <span>Cloud Computing</span>
        </div>

        <footer>
            Built as part of my AWS & DevOps learning journey.
        </footer>

    </div>

</body>
</html>
